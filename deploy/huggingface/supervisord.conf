[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
directory=/srv/apps/backend
command=/opt/venv-backend/bin/uvicorn app.main:app --host 0.0.0.0 --port 7860 --proxy-headers --forwarded-allow-ips "*"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The AI service and worker wait for the API: it seeds the demo station they read on start.
[program:ai-service]
directory=/srv/apps/ai-service
command=bash -c 'until curl -sf http://127.0.0.1:7860/health >/dev/null; do sleep 1; done; exec /opt/venv-ai/bin/python -m app.main'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
directory=/srv/apps/worker
command=bash -c 'until curl -sf http://127.0.0.1:7860/health >/dev/null; do sleep 1; done; exec /opt/venv-worker/bin/python -m app.main'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:demo-user]
command=/opt/venv-backend/bin/python /srv/deploy/huggingface/create_demo_user.py
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
