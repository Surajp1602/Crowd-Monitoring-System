# cert-manager issues ccd-tls for both hosts. The ClusterIssuer (e.g. letsencrypt-prod with an
# HTTP-01 or DNS-01 solver) is cluster infrastructure and is not defined here.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ccd-tls
  namespace: ccd
spec:
  secretName: ccd-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - control.example.com
    - www.example.com
