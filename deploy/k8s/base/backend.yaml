# REST + WebSocket API. Stateless: every replica runs its own Redis -> WebSocket bridge, so any
# replica can serve any dashboard connection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ccd-backend
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: ccd-config }
            - secretRef: { name: ccd-secrets }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: media, mountPath: /data/media, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: media
          persistentVolumeClaim: { claimName: ccd-media }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - { name: http, port: 8000, targetPort: http }
