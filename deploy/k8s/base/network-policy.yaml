# Only the edge accepts traffic from outside the namespace. Everything else talks within it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: same-namespace-only
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-from-anywhere
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: edge }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 80 }
        - { port: 443 }
