# The same NGINX edge as the compose stack: TLS, the product site, the control center proxy and the
# rate limits. The certificate comes from the ccd-tls Secret (cert-manager in production).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: edge }
  template:
    metadata:
      labels: { app.kubernetes.io/name: edge }
    spec:
      containers:
        - name: edge
          image: ccd-edge
          ports:
            - { name: http, containerPort: 80 }
            - { name: https, containerPort: 443 }
          env:
            - name: APP_HOST
              valueFrom: { configMapKeyRef: { name: ccd-config, key: APP_HOST } }
            - name: SITE_HOST
              valueFrom: { configMapKeyRef: { name: ccd-config, key: SITE_HOST } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: ccd-tls
            items:
              - { key: tls.crt, path: fullchain.pem }
              - { key: tls.key, path: privkey.pem }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  type: LoadBalancer
  # Keeps the client address, which the login rate limits key on.
  externalTrafficPolicy: Local
  selector: { app.kubernetes.io/name: edge }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: https, port: 443, targetPort: https }
