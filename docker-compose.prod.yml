# Production overlay: everything behind the NGINX edge on 80/443, no service ports published,
# development defaults refused, demo data off.
#
#   cp .env.production.example .env.production   # fill in every secret
#   sh infra/scripts/dev-certs.sh                  # or mount real certificates in infra/nginx/certs
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
#   ... --profile monitoring up -d                 # adds Prometheus and Grafana
#
# Every ${VAR:?} below must be set; compose stops with the variable's name if one is missing.

x-prod-db: &prod-db
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ccd}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ccd}
  REDIS_URL: redis://redis:6379/0

x-prod-backend-env: &prod-backend-env
  <<: *prod-db
  ENVIRONMENT: production
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (48+ random characters)}
  INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?set INTERNAL_SERVICE_API_KEY}
  CAMERA_CREDENTIAL_ENCRYPTION_KEY: ${CAMERA_CREDENTIAL_ENCRYPTION_KEY:?set CAMERA_CREDENTIAL_ENCRYPTION_KEY (a Fernet key)}
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:?set FIRST_ADMIN_EMAIL}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?set FIRST_ADMIN_PASSWORD}
  CORS_ORIGINS: '["https://${APP_HOST:?set APP_HOST}"]'
  TRUST_PROXY_HEADERS: "true"
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  METRICS_TOKEN: ${METRICS_TOKEN:-}

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  redis:
    ports: !reset []

  migrate:
    environment:
      <<: *prod-backend-env

  backend:
    ports: !reset []
    environment:
      <<: *prod-backend-env
    deploy:
      resources:
        limits: { memory: 1g }

  ai-service:
    environment:
      <<: *prod-db
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?set INTERNAL_SERVICE_API_KEY}
      CAMERA_CREDENTIAL_ENCRYPTION_KEY: ${CAMERA_CREDENTIAL_ENCRYPTION_KEY:?set CAMERA_CREDENTIAL_ENCRYPTION_KEY}

  worker:
    environment:
      <<: *prod-db
      PUBLIC_DASHBOARD_URL: https://${APP_HOST:?set APP_HOST}
      SEED_DEMO_HISTORY: ${SEED_DEMO_HISTORY:-false}

  frontend:
    ports: !reset []
    build:
      args:
        # Empty means same origin: the browser calls https://APP_HOST/api and wss://APP_HOST/ws.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""

  edge:
    image: crowd-density-edge:latest
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_DASHBOARD_URL: https://${APP_HOST:?set APP_HOST}
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST}
      SITE_HOST: ${SITE_HOST:?set SITE_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    depends_on: [backend]

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # Bound to loopback: reach it over an SSH tunnel or put it behind your own SSO proxy.
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  promdata:
  grafanadata:
