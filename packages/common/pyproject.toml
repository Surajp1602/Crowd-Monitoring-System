[project]
name = "ccd-common"
version = "0.1.0"
description = "Shared SQLAlchemy models, Pydantic schemas, and enums for the Crowd Density platform"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
include = ["common*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
