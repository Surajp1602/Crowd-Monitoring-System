name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            requirements: requirements-dev.txt
          - service: worker
            requirements: requirements-dev.txt
          # The GPU model stack is imported lazily and never needed by the tests.
          - service: ai-service
            requirements: requirements-test.txt
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements*.txt
      - run: pip install -r ${{ matrix.requirements }} -e ../../packages/common
      - run: python -m pytest -q

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.4.10
      - run: ruff check apps/backend/app apps/worker/app apps/ai-service/app packages/common --select E9,F63,F7,F82,F401

  migrations:
    name: migrations on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ccd, POSTGRES_PASSWORD: ccd, POSTGRES_DB: ccd }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ccd:ccd@localhost:5432/ccd
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Upgrade, downgrade and upgrade again
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    name: container images and configs
    runs-on: ubuntu-latest
    needs: [python, frontend, landing]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend, worker, frontend and edge images
        run: |
          docker build -f apps/backend/Dockerfile -t ccd-backend .
          docker build -f apps/worker/Dockerfile -t ccd-worker .
          docker build -f apps/frontend/Dockerfile -t ccd-frontend --build-arg NEXT_PUBLIC_API_URL= --build-arg NEXT_PUBLIC_WS_URL= .
          docker build -f infra/nginx/Dockerfile -t ccd-edge .
      - name: Backend image runs unprivileged and refuses development secrets in production
        run: |
          test "$(docker run --rm ccd-backend id -u)" != "0"
          ! docker run --rm -e ENVIRONMENT=production -e DEBUG=false ccd-backend python -c "import app.main"
      - name: NGINX config is valid
        run: |
          sh infra/scripts/dev-certs.sh
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -v "$PWD/infra/nginx/certs:/etc/nginx/certs:ro" ccd-edge nginx -t
      - name: Kubernetes overlays render
        run: |
          kubectl kustomize deploy/k8s/overlays/dev > /dev/null
          kubectl kustomize deploy/k8s/overlays/production > /dev/null
      - name: Production compose overlay resolves
        run: |
          cp .env.production.example ci.env
          sed -i -E 's/^(POSTGRES_PASSWORD|SECRET_KEY|INTERNAL_SERVICE_API_KEY|CAMERA_CREDENTIAL_ENCRYPTION_KEY|FIRST_ADMIN_EMAIL|FIRST_ADMIN_PASSWORD|GRAFANA_ADMIN_PASSWORD)=$/\1=ci/' ci.env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file ci.env --profile monitoring config -q
