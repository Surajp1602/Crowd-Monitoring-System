groups:
  - name: ccd-api
    rules:
      - alert: ApiDown
        expr: up{job="backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: The CCD API has not answered a scrape for 2 minutes.
      - alert: ApiErrorRate
        expr: sum(rate(ccd_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(ccd_http_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: More than 5% of API requests are failing.
      - alert: ApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(ccd_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 95th percentile API latency is above one second.
      - alert: LoginThrottling
        expr: sum(rate(ccd_http_requests_total{route="/api/v1/auth/login",status="429"}[5m])) > 0.2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Sign-in attempts are being throttled; possible password guessing.
