# Scrapes the API on the internal network. /metrics is refused at the edge. If you set METRICS_TOKEN
# on the backend, add an `authorization: { credentials: <token> }` block to the job below.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
