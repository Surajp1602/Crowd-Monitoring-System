name: crowd-density

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ccd:ccd@postgres:5432/ccd}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production-this-is-not-secure}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
  GUEST_TOKEN_EXPIRE_MINUTES: ${GUEST_TOKEN_EXPIRE_MINUTES:-120}
  CAMERA_CREDENTIAL_ENCRYPTION_KEY: ${CAMERA_CREDENTIAL_ENCRYPTION_KEY:-3vY9x2b6w0G8e5v3q9m1n4p7r0t2u5x8A1b3D6f9J2k=}
  INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:-dev-internal-service-key-change-me}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@ccd-platform.com}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-ChangeMe123!}
  FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-Platform Administrator}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccd}
      POSTGRES_DB: ${POSTGRES_DB:-ccd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccd} -d ${POSTGRES_DB:-ccd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: crowd-density-backend:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      <<: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: crowd-density-backend:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ai-service:
    image: crowd-density-ai:latest
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
      args:
        BASE_IMAGE: ${AI_SERVICE_BASE_IMAGE:-pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ccd:ccd@postgres:5432/ccd}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BACKEND_URL: http://backend:8000
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:-dev-internal-service-key-change-me}
      CAMERA_CREDENTIAL_ENCRYPTION_KEY: ${CAMERA_CREDENTIAL_ENCRYPTION_KEY:-3vY9x2b6w0G8e5v3q9m1n4p7r0t2u5x8A1b3D6f9J2k=}
      DEVICE: ${AI_SERVICE_DEVICE:-auto}
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    depends_on:
      backend:
        condition: service_healthy

  worker:
    image: crowd-density-worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ccd:ccd@postgres:5432/ccd}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:3000}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-console}
      NOTIFICATION_SMS_PROVIDER: ${NOTIFICATION_SMS_PROVIDER:-console}
      NOTIFICATION_WHATSAPP_PROVIDER: ${NOTIFICATION_WHATSAPP_PROVIDER:-console}
      NOTIFICATION_PUSH_PROVIDER: ${NOTIFICATION_PUSH_PROVIDER:-console}
      NOTIFICATION_ANNOUNCEMENT_PROVIDER: ${NOTIFICATION_ANNOUNCEMENT_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-CCD Alerts <alerts@ccd-platform.com>}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      PUSH_WEBHOOK_URL: ${PUSH_WEBHOOK_URL:-}
      ANNOUNCEMENT_WEBHOOK_URL: ${ANNOUNCEMENT_WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: crowd-density-frontend:latest
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  media:
